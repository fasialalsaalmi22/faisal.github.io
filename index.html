<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث يوتيوب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .search-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 60%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #cc0000;
        }
        .iframe-container {
            width: 80%;
            height: 500px;
            margin: 0 auto;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>مبحاث يوتيوب</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ضع رابط فيديو يوتيوب أو اطلب البحث...">
        <button onclick="searchYouTube()">عرض الفيديو</button>
    </div>

    <div class="iframe-container">
        <iframe id="youtubeFrame" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <script>
        function searchYouTube() {
            var input = document.getElementById('searchInput').value.trim();
            var frame = document.getElementById('youtubeFrame');
            
            // إذا كان المدخل رابط يوتيوب مباشر
            if (input.includes("watch?v=")) {
                var videoId = input.split("v=")[1].split("&")[0];
                frame.src = "https://www.youtube.com/embed/" + videoId;
            } else if (input.includes("youtu.be/")) {
                var videoId = input.split("youtu.be/")[1].split("?")[0];
                frame.src = "https://www.youtube.com/embed/" + videoId;
            } else if (input !== "") {
                // فتح نتائج البحث مباشرة
                window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(input), "_self");
            }
        }
    </script>

</body>
</html>
