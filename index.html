
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك بحث يوتيوب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .search-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 60%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #cc0000;
        }
        .iframe-container {
            width: 80%;
            height: 500px;
            margin: 0 auto;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>مبحاث يوتيوب</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="اكتب اسم الفيديو أو الموضوع...">
        <button onclick="searchYouTube()">بحث</button>
    </div>

    <div class="iframe-container">
        <iframe id="youtubeFrame" src="about:blank"></iframe>
    </div>

    <script>
        function searchYouTube() {
            var query = document.getElementById('searchInput').value;
            if (query.trim() !== "") {
                // يعرض نتائج البحث مباشرة داخل الإطار (iframe)
                var embedUrl = "https://www.youtube.com/embed?listType=search&list=" + encodeURIComponent(query);
                document.getElementById('youtubeFrame').src = embedUrl;
            }
        }
    </script>

</body>
</html>
